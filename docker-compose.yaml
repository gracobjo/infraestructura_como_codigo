services:
  # --- HADOOP STACK ---
  namenode:
    build: .
    container_name: namenode
    hostname: namenode
    env_file: hadoop.env
    command: ["/bin/bash", "-c", "if [ ! -d /opt/hadoop/data/nameNode/current ]; then hdfs namenode -format; fi; hdfs namenode"]
    ports:
      - "9870:9870" # Web UI
      - "9000:9000" # RPC
    volumes:
      - namenode_data:/opt/hadoop/data/nameNode
    networks:
      - bigdata-net

  datanode1:
    build: .
    container_name: datanode1
    env_file: hadoop.env
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    volumes:
      - datanode1_data:/opt/hadoop/data/dataNode
    networks:
      - bigdata-net

  datanode2:
    build: .
    container_name: datanode2
    env_file: hadoop.env
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    volumes:
      - datanode2_data:/opt/hadoop/data/dataNode
    networks:
      - bigdata-net

  # --- SPARK STACK ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    env_file: hadoop.env
    networks:
      - bigdata-net

  # --- KAFKA (KRaft) ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - bigdata-net

  # --- JUPYTER ---
  python-env:
    image: jupyter/pyspark-notebook:latest
    container_name: python-env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYSPARK_PYTHON=python3
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data: